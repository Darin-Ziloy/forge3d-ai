[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge3d-ai"
version = "0.2.0"
description = "Local, headless 3D workspace for AI agents with a human viewer"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["mcp==2.3.0", "pydantic==2.14.1"]

[project.urls]
Homepage = "https://github.com/Darin-Ziloy/forge3d-ai"
Repository = "https://github.com/Darin-Ziloy/forge3d-ai"
Issues = "https://github.com/Darin-Ziloy/forge3d-ai/issues"

[project.scripts]
forge3d = "forge3d.cli:main"

[tool.setuptools.packages.find]
include = ["forge3d*"]

[tool.setuptools.package-data]
forge3d = ["web/*", "web/vendor/*", "web/vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
